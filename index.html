<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking — Desafio Pós-Páscoa · Victor Afonso</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --verde:        #92C68F;
    --verde-escuro: #6aab67;
    --verde-suave:  #f2faf1;
    --verde-claro:  #e8f5e7;
    --texto:        #2a2a2a;
    --muted:        #8a9a89;
    --borda:        #d4e8d2;
    --branco:       #ffffff;
    --fundo:        #f7fcf6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--fundo);
    color: var(--texto);
    font-family: 'Lato', sans-serif;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(146,198,143,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(146,198,143,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo-mark {
    width: 100px; height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--borda);
    background: white;
    padding: 4px;
    margin: 0 auto 16px;
    display: block;
  }

  .brand-name {
    font-size: 22px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--texto); line-height: 1; margin-bottom: 4px;
  }

  .brand-sub {
    font-size: 10px; letter-spacing: 0.35em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 24px;
  }

  .divider {
    width: 40px; height: 2px;
    background: var(--verde);
    margin: 0 auto 18px; border-radius: 2px;
  }

  .challenge-title {
    font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--verde-escuro);
    font-weight: 700; margin-bottom: 6px;
  }

  .challenge-dates {
    font-size: 13px; color: var(--muted); font-weight: 300;
  }

  /* ── STATUS ── */
  .status-bar {
    display: flex; align-items: center;
    justify-content: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    margin-bottom: 32px;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%; background: var(--verde);
    animation: pulse 2.5s infinite; flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.8); }
  }

  /* ── PÓDIO ── */
  .podium-wrap {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: 20px;
    padding: 32px 16px 0;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .podium-label {
    text-align: center;
    font-size: 10px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 24px;
  }

  .podium-top3 {
    display: flex; align-items: flex-end;
    justify-content: center; gap: 4px;
  }

  .podium-45 {
    display: flex; justify-content: center;
    gap: 4px; margin-top: 12px;
    padding: 0 8px 24px;
  }

  .podium-item {
    flex: 1; max-width: 180px;
    text-align: center;
    animation: riseUp 0.6s cubic-bezier(.22,.68,0,1.15) both;
  }

  .podium-top3 .podium-item:nth-child(1) { animation-delay: 0.15s; }
  .podium-top3 .podium-item:nth-child(2) { animation-delay: 0s; }
  .podium-top3 .podium-item:nth-child(3) { animation-delay: 0.3s; }
  .podium-45   .podium-item:nth-child(1) { animation-delay: 0.4s; }
  .podium-45   .podium-item:nth-child(2) { animation-delay: 0.5s; }

  @keyframes riseUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .p-medal { font-size: 18px; margin-bottom: 6px; }

  .p-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 900;
    margin: 0 auto 8px;
    border: 2px solid var(--borda);
    background: var(--verde-suave); color: var(--verde-escuro);
  }

  .podium-item.p1 .p-avatar {
    width: 62px; height: 62px; font-size: 22px;
    background: rgba(146,198,143,0.15); border-color: var(--verde);
  }

  .podium-item.p45 .p-avatar {
    width: 40px; height: 40px; font-size: 14px;
    background: rgba(146,198,143,0.05);
    border-color: var(--borda); color: var(--muted);
  }

  .p-name {
    font-size: 12px; font-weight: 700; color: var(--texto);
    margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .podium-item.p1  .p-name { font-size: 14px; }
  .podium-item.p45 .p-name { font-size: 11px; color: var(--muted); }

  .p-id { font-size: 10px; color: var(--muted); margin-bottom: 8px; }

  .p-block {
    border-radius: 8px 8px 0 0; padding: 12px 8px;
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
  }

  .podium-item.p1 .p-block {
    height: 100px;
    background: linear-gradient(180deg, rgba(146,198,143,0.2) 0%, rgba(146,198,143,0.06) 100%);
    border: 1px solid rgba(146,198,143,0.35); border-bottom: none;
  }

  .podium-item.p2 .p-block {
    height: 72px;
    background: rgba(138,154,170,0.07);
    border: 1px solid rgba(138,154,170,0.2); border-bottom: none;
  }

  .podium-item.p3 .p-block {
    height: 52px;
    background: rgba(176,120,72,0.07);
    border: 1px solid rgba(176,120,72,0.2); border-bottom: none;
  }

  .podium-item.p45 .p-block {
    height: 36px;
    background: rgba(146,198,143,0.04);
    border: 1px solid var(--borda); border-radius: 8px;
  }

  .p-pts {
    font-size: 24px; font-weight: 900;
    line-height: 1; color: var(--texto);
  }

  .podium-item.p1  .p-pts { font-size: 30px; color: var(--verde-escuro); }
  .podium-item.p45 .p-pts { font-size: 16px; color: var(--muted); }

  .p-pts-label {
    font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
  }

  /* ── HALL DA FAMA ── */
  .hall-wrap {
    background: linear-gradient(135deg, rgba(146,198,143,0.1) 0%, rgba(146,198,143,0.03) 100%);
    border: 2px solid var(--verde);
    border-radius: 18px;
    padding: 22px 20px;
    margin-bottom: 24px;
    position: relative;
  }

  .hall-wrap::before {
    content: '';
    position: absolute;
    top: -1px; left: 24px; right: 24px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--verde), transparent);
  }

  .hall-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }

  .hall-icon {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(146,198,143,0.2);
    border: 1.5px solid var(--verde);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }

  .hall-title {
    font-size: 13px; font-weight: 900;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--verde-escuro);
  }

  .hall-nav {
    display: flex; align-items: center; gap: 6px;
    margin-left: auto;
  }

  .hall-nav-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: none; border: 1px solid var(--borda);
    color: var(--muted); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; line-height: 1;
  }

  .hall-nav-btn:hover:not(:disabled) { border-color: var(--verde); color: var(--verde-escuro); }
  .hall-nav-btn:disabled { opacity: 0.3; cursor: default; }

  .hall-nav-date {
    font-size: 12px; font-weight: 700;
    color: var(--texto); min-width: 44px; text-align: center;
  }

  .hall-hoje-btn {
    font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--verde-escuro);
    font-weight: 700; cursor: pointer; padding: 3px 9px;
    border: 1px solid var(--verde); border-radius: 20px;
    background: var(--verde-suave);
  }

  .hall-list {
    display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px;
  }

  .hall-chip {
    display: flex; align-items: center; gap: 7px;
    background: white; border: 1px solid var(--borda);
    border-radius: 40px; padding: 6px 12px 6px 6px;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hall-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(146,198,143,0.25); border: 1px solid var(--verde);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; color: var(--verde-escuro);
  }

  .hall-name  { font-size: 13px; font-weight: 700; color: var(--texto); }
  .hall-check { font-size: 11px; color: var(--verde-escuro); font-weight: 700; margin-left: 2px; }

  .hall-empty {
    font-size: 13px; color: var(--muted);
    font-style: italic; padding: 4px 0; width: 100%;
  }

  /* ── BUSCA ── */
  .busca-wrap {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 24px;
  }

  .busca-titulo {
    font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 12px;
  }

  .busca-row { display: flex; gap: 8px; }

  .busca-input {
    flex: 1; min-width: 0;
    background: var(--fundo);
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 11px 16px;
    color: var(--texto);
    font-family: 'Lato', sans-serif;
    font-size: 15px; outline: none;
    transition: border-color 0.2s;
  }

  .busca-input::placeholder { color: var(--muted); }
  .busca-input:focus { border-color: var(--verde); }

  .busca-btn {
    background: var(--verde); border: none;
    border-radius: 10px; color: white;
    font-family: 'Lato', sans-serif;
    font-size: 14px; font-weight: 700;
    padding: 11px 18px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
    transition: background 0.2s;
  }

  .busca-btn:hover { background: var(--verde-escuro); }

  .busca-resultado { margin-top: 16px; display: none; }
  .busca-resultado.visivel { display: block; }

  .resultado-card {
    background: var(--verde-suave);
    border: 1px solid var(--borda);
    border-radius: 12px; padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
  }

  .resultado-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(146,198,143,0.25);
    border: 2px solid var(--verde);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 900;
    color: var(--verde-escuro); flex-shrink: 0;
  }

  .resultado-info { flex: 1; min-width: 0; }

  .resultado-nome {
    font-size: 16px; font-weight: 900; color: var(--texto);
    margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .resultado-id { font-size: 11px; color: var(--muted); font-weight: 300; }

  .resultado-direita { text-align: right; flex-shrink: 0; }

  .resultado-pts-label {
    font-size: 9px; color: var(--muted);
    letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 2px;
  }

  .resultado-pts {
    font-size: 28px; font-weight: 900;
    color: var(--verde-escuro); line-height: 1;
  }

  .resultado-pos { font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }

  .busca-nada {
    margin-top: 12px; font-size: 13px; color: var(--muted);
    text-align: center; padding: 8px 0; font-style: italic;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    margin-top: 48px; padding-top: 24px;
    border-top: 1px solid var(--borda);
  }

  .footer-logo {
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 4px;
  }

  .footer-sub {
    font-size: 11px; color: #c0d0be;
    letter-spacing: 0.2em; text-transform: uppercase;
  }

  .atualizar-btn {
    background: none; border: 1px solid var(--borda);
    border-radius: 8px; color: var(--muted);
    font-family: 'Lato', sans-serif; font-size: 12px;
    padding: 6px 14px; cursor: pointer; margin-top: 14px;
    transition: all 0.2s;
  }

  .atualizar-btn:hover { border-color: var(--verde); color: var(--verde-escuro); }
</style>
</head>
<body>

<div class="wrap">

  <!-- HEADER -->
  <header class="header">
    <img
      class="logo-mark"
      src="logo.jpg"
      alt="Victor Afonso Nutricionista"
      onerror="this.style.display='none'"
    >
    <div class="brand-name">Victor Afonso</div>
    <div class="brand-sub">Nutricionista</div>
    <div class="divider"></div>
    <div class="challenge-title">Desafio Pós-Páscoa</div>
    <div class="challenge-dates">13 de abril — 04 de maio</div>
  </header>

  <!-- STATUS -->
  <div class="status-bar">
    <span class="dot"></span>
    <span id="statusText">Carregando...</span>
  </div>

  <!-- 1. PÓDIO TOP 5 -->
  <div class="podium-wrap" id="podiumWrap" style="display:none">
    <div class="podium-label">Pódio</div>
    <div class="podium-top3" id="podiumTop3"></div>
    <div class="podium-45"   id="podium45"></div>
  </div>

  <!-- 2. HALL DA FAMA -->
  <div class="hall-wrap" id="hallWrap" style="display:none">
    <div class="hall-header">
      <div class="hall-icon">🌟</div>
      <div class="hall-title">Hall da Fama</div>
      <div class="hall-nav">
        <button class="hall-hoje-btn" id="hallHojeBtn" onclick="voltarHoje()" style="display:none">hoje</button>
        <button class="hall-nav-btn" id="hallPrevBtn" onclick="navegarHall(-1)">‹</button>
        <span class="hall-nav-date" id="hallNavDate"></span>
        <button class="hall-nav-btn" id="hallNextBtn" onclick="navegarHall(1)">›</button>
      </div>
    </div>
    <div class="hall-list" id="hallList"></div>
  </div>

  <!-- 3. BUSCA INDIVIDUAL -->
  <div class="busca-wrap">
    <div class="busca-titulo">Encontre sua pontuação</div>
    <div class="busca-row">
      <input
        type="text"
        class="busca-input"
        id="buscaInput"
        placeholder="Digite seu nome ou ID..."
        oninput="buscar()"
        autocomplete="off"
      >
      <button class="busca-btn" onclick="buscar()">Buscar</button>
    </div>
    <div class="busca-resultado" id="buscaResultado"></div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-logo">Victor Afonso</div>
    <div class="footer-sub">Nutricionista · Ranking oficial</div>
    <button class="atualizar-btn" onclick="carregar()">↻ Atualizar ranking</button>
  </footer>

</div>

<script>
  const API    = 'https://script.google.com/macros/s/AKfycbxOcTEvrZE-af3C4c1WwzQyP2qCrcuGEmhSChW2xcW1kH7tIti08z9ksUq0ADhly2VlBA/exec';
  const INICIO = new Date(2025, 3, 13); // 13/04/2025

  let dados    = [];
  let hallData = new Date();
  hallData.setHours(0, 0, 0, 0);

  /* ── CARGA ── */
  function carregar() {
    document.getElementById('statusText').textContent = 'Carregando...';
    fetch(API)
      .then(r => r.json())
      .then(d => {
        if (!Array.isArray(d) || !d.length) throw new Error('vazio');
        dados = d;
        renderPodio();
        renderHall();
        const agora = new Date().toLocaleString('pt-BR');
        document.getElementById('statusText').textContent = 'Atualizado às ' + agora;
      })
      .catch(() => {
        document.getElementById('statusText').textContent = 'Erro ao carregar. Tente novamente.';
      });
  }

  /* ── PÓDIO ── */
  function renderPodio() {
    document.getElementById('podiumWrap').style.display = 'block';

    const top3 = dados.slice(0, 3);
    const p45  = dados.slice(3, 5);
    const medals = ['🥇', '🥈', '🥉'];

    // Ordem visual: 2°, 1°, 3°
    const ordemVisual = top3.length >= 2
      ? [top3[1], top3[0], top3[2]].filter(Boolean)
      : top3;
    const classes = top3.length >= 2 ? ['p2', 'p1', 'p3'] : ['p1', 'p2', 'p3'];

    document.getElementById('podiumTop3').innerHTML = ordemVisual.map((item, i) => {
      const idx = top3.indexOf(item);
      return itemPodio(item, classes[i], medals[idx]);
    }).join('');

    document.getElementById('podium45').innerHTML = p45.map((item, i) =>
      itemPodio(item, 'p45', (i + 4) + 'º')
    ).join('');
  }

  function itemPodio(item, cls, medalha) {
    const ini = iniciais(item.nome || item.id);
    return `
      <div class="podium-item ${cls}">
        <div class="p-medal">${medalha}</div>
        <div class="p-avatar">${ini}</div>
        <div class="p-name">${item.nome || item.id}</div>
        <div class="p-id">${item.nome ? item.id : ''}</div>
        <div class="p-block">
          <div class="p-pts">${item.pts}</div>
          <div class="p-pts-label">pts</div>
        </div>
      </div>`;
  }

  /* ── HALL DA FAMA ── */
  function renderHall() {
    const wrap     = document.getElementById('hallWrap');
    const list     = document.getElementById('hallList');
    const dateEl   = document.getElementById('hallNavDate');
    const prevBtn  = document.getElementById('hallPrevBtn');
    const nextBtn  = document.getElementById('hallNextBtn');
    const hojeBtn  = document.getElementById('hallHojeBtn');

    wrap.style.display = 'block';

    const hoje  = new Date(); hoje.setHours(0, 0, 0, 0);
    const eHoje = hallData.getTime() === hoje.getTime();
    const dataFmt = hallData.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });

    dateEl.textContent    = dataFmt;
    prevBtn.disabled      = hallData <= INICIO;
    nextBtn.disabled      = eHoje;
    hojeBtn.style.display = eHoje ? 'none' : 'inline-block';

    const perfeitos = dados.filter(d => {
      if (eHoje) return +d.pts_hoje === 2;
      const key = dataFmt.replace('/', '_');
      return d.pts_por_dia && +d.pts_por_dia[key] === 2;
    });

    if (!perfeitos.length) {
      list.innerHTML = `<div class="hall-empty">${
        eHoje
          ? 'Nenhum participante com pontuação máxima hoje ainda 🌱'
          : 'Nenhum registro para este dia 📋'
      }</div>`;
      return;
    }

    list.innerHTML = perfeitos.map((item, i) => {
      const ini   = iniciais(item.nome || item.id);
      const delay = (i * 0.06).toFixed(2);
      return `
        <div class="hall-chip" style="animation-delay:${delay}s">
          <div class="hall-avatar">${ini}</div>
          <span class="hall-name">${item.nome || item.id}</span>
          <span class="hall-check">2/2 ✓</span>
        </div>`;
    }).join('');
  }

  function navegarHall(delta) {
    const nova  = new Date(hallData);
    nova.setDate(nova.getDate() + delta);
    const hoje  = new Date(); hoje.setHours(0, 0, 0, 0);
    if (nova > hoje || nova < INICIO) return;
    hallData = nova;
    renderHall();
  }

  function voltarHoje() {
    hallData = new Date(); hallData.setHours(0, 0, 0, 0);
    renderHall();
  }

  /* ── BUSCA ── */
  function buscar() {
    const q  = document.getElementById('buscaInput').value.trim().toLowerCase();
    const el = document.getElementById('buscaResultado');

    if (!q) {
      el.classList.remove('visivel');
      el.innerHTML = '';
      return;
    }

    const achou = dados.find(d =>
      (d.nome || '').toLowerCase().includes(q) ||
      String(d.id || '').toLowerCase() === q
    );

    el.classList.add('visivel');

    if (!achou) {
      el.innerHTML = '<div class="busca-nada">Não encontramos seu nome. Confira se digitou corretamente 🌿</div>';
      return;
    }

    const ini = iniciais(achou.nome || achou.id);
    el.innerHTML = `
      <div class="resultado-card">
        <div class="resultado-avatar">${ini}</div>
        <div class="resultado-info">
          <div class="resultado-nome">${achou.nome || achou.id}</div>
          <div class="resultado-id">ID ${achou.id}</div>
        </div>
        <div class="resultado-direita">
          <div class="resultado-pts-label">pontos</div>
          <div class="resultado-pts">${achou.pts}</div>
          <div class="resultado-pos">${achou.pos ? achou.pos + 'º lugar' : ''}</div>
        </div>
      </div>`;
  }

  /* ── UTILITÁRIOS ── */
  function iniciais(txt) {
    if (!txt) return '?';
    const p = txt.trim().split(' ');
    return p.length >= 2
      ? (p[0][0] + p[1][0]).toUpperCase()
      : txt.slice(0, 2).toUpperCase();
  }

  // Atualização automática a cada 5 minutos
  setInterval(carregar, 5 * 60 * 1000);

  carregar();
</script>
